name: Deploy Backend to MonsterASP.NET

on:
  push:
    branches:
      - master_integration
      - main
      - master
    paths:
      - 'appoynt_backend/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore appoynt_backend/Appoynt.API/Appoynt.API.csproj

      - name: Build project
        run: dotnet build appoynt_backend/Appoynt.API/Appoynt.API.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish appoynt_backend/Appoynt.API/Appoynt.API.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Deploy via FTP to MonsterASP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}/
          protocol: ftp
          port: 21
