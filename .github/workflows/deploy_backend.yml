name: Deploy Backend to MonsterASP.NET

on:
  push:
    branches:
      - master_integration
      - main
      - master
    paths:
      - 'appoynt_backend/**'

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
          include-prerelease: true

      - name: Restore dependencies
        run: dotnet restore appoynt_backend/Appoynt.API/Appoynt.API.csproj

      - name: Build project
        run: dotnet build appoynt_backend/Appoynt.API/Appoynt.API.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish appoynt_backend/Appoynt.API/Appoynt.API.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Deploy to MonsterASP via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: './publish'
