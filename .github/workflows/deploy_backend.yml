name: Deploy Backend to MonsterASP.NET

on:
  push:
    branches:
      - master_integration
      - main
      - master
    paths:
      - 'appoynt_backend/**'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore appoynt_backend/Appoynt.API/Appoynt.API.csproj

      - name: Build project
        run: dotnet build appoynt_backend/Appoynt.API/Appoynt.API.csproj --configuration Release --no-restore

      - name: Publish project
        run: dotnet publish appoynt_backend/Appoynt.API/Appoynt.API.csproj --configuration Release --output ./publish --runtime win-x86

      - name: Deploy to MonsterASP via MSDeploy
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}
        run: |
          $msdeploy = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeploy)) {
            $msdeploy = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }

          $site     = $env:WEBSITE_NAME.Trim()
          $computer = $env:SERVER_COMPUTER_NAME.Trim()
          $user     = $env:SERVER_USERNAME.Trim()
          $pass     = $env:SERVER_PASSWORD.Trim()
          $src      = (Resolve-Path "./publish").Path

          Write-Host "Source path: $src"
          Write-Host "Deploying to: $computer"

          $msdeployArgs = @(
            '-verb:sync',
            "-source:contentPath=$src",
            "-dest:contentPath=$site,ComputerName=$computer,UserName=$user,Password=$pass,AuthType=Basic",
            '-allowUntrusted',
            '-enableRule:DoNotDeleteRule'
          )

          Write-Host "Deploying to MonsterASP.NET..."
          & $msdeploy @msdeployArgs
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MSDeploy failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Deployment successful!"
