name: "Build Flutter APK & Notify Team"

on:
  push:
    branches:
      - master_integration
    paths:
      - 'appoynt_moblie_app/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_and_notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Dependencies
        working-directory: appoynt_moblie_app
        run: flutter pub get

      - name: Build Release APK
        working-directory: appoynt_moblie_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Get Build Info
        id: info
        run: |
          DATE=$(date +'%Y-%m-%d-%H%M')
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "tag=apk-$DATE" >> $GITHUB_OUTPUT
          echo "commit_msg=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "Appoynt Mobile - ${{ steps.info.outputs.date }}"
          body: |
            ### 📱 Appoynt APK Auto Build
            - **Date:** ${{ steps.info.outputs.date }}
            - **Commit:** ${{ steps.info.outputs.short_sha }} - ${{ steps.info.outputs.commit_msg }}
            - **Branch:** master_integration
          files: appoynt_moblie_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false

      - name: Send Email Notification via Resend
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          TAG="${{ steps.info.outputs.tag }}"
          DATE="${{ steps.info.outputs.date }}"
          COMMIT="${{ steps.info.outputs.commit_msg }}"
          SHORT_SHA="${{ steps.info.outputs.short_sha }}"
          APK_URL="https://github.com/kholoudkhaledAppoynt/Appoynt/releases/download/$TAG/app-release.apk"
          RELEASE_URL="https://github.com/kholoudkhaledAppoynt/Appoynt/releases/tag/$TAG"

          HTML_BODY="<div style='font-family:Arial,sans-serif;max-width:600px;margin:auto;padding:20px;border:1px solid #e0e0e0;border-radius:12px;'><div style='text-align:center;background:#4F46E5;padding:20px;border-radius:10px 10px 0 0;'><h1 style='color:white;margin:0;font-size:24px;'>📱 Appoynt</h1><p style='color:#c7d2fe;margin:5px 0 0 0;'>New APK Build Ready</p></div><div style='padding:24px;'><p style='font-size:16px;color:#374151;'>A new version of the Appoynt mobile app has been built and is ready for testing!</p><table style='width:100%;border-collapse:collapse;margin:16px 0;'><tr style='background:#f9fafb;'><td style='padding:10px 14px;border:1px solid #e5e7eb;font-weight:bold;color:#374151;width:35%;'>📅 Build Date</td><td style='padding:10px 14px;border:1px solid #e5e7eb;color:#374151;'>$DATE</td></tr><tr><td style='padding:10px 14px;border:1px solid #e5e7eb;font-weight:bold;color:#374151;'>📌 Commit</td><td style='padding:10px 14px;border:1px solid #e5e7eb;color:#374151;'>$SHORT_SHA - $COMMIT</td></tr><tr style='background:#f9fafb;'><td style='padding:10px 14px;border:1px solid #e5e7eb;font-weight:bold;color:#374151;'>🌿 Branch</td><td style='padding:10px 14px;border:1px solid #e5e7eb;color:#374151;'>master_integration</td></tr></table><div style='text-align:center;margin:28px 0;'><a href='$APK_URL' style='display:inline-block;background:#4F46E5;color:white;padding:14px 32px;border-radius:8px;text-decoration:none;font-size:16px;font-weight:bold;margin:0 8px;'>📥 Download APK</a><a href='$RELEASE_URL' style='display:inline-block;background:#059669;color:white;padding:14px 32px;border-radius:8px;text-decoration:none;font-size:16px;font-weight:bold;margin:0 8px;'>🔍 View Release</a></div><p style='color:#6b7280;font-size:13px;text-align:center;border-top:1px solid #e5e7eb;padding-top:16px;margin-top:16px;'>This is an automated message generated by GitHub Actions.<br/>Appoynt Development Team 🚀</p></div></div>"

          RECIPIENTS=(
            "mustafa.mahmoud.appoynt@gmail.com"
            "kholoud.khaled.appoynt@gmail.com"
            "menna.ahmed.appoynt@gmail.com"
            "shimaa.salah.appoynt@gmail.com"
            "mohamed.kotb.appoynt@gmail.com"
          )

          for TO_EMAIL in "${RECIPIENTS[@]}"; do
            PAYLOAD=$(jq -n \
              --arg from "Appoynt Builds <onboarding@resend.dev>" \
              --arg to "$TO_EMAIL" \
              --arg subject "🚀 Appoynt - New APK Build Ready ($DATE)" \
              --arg html "$HTML_BODY" \
              '{from: $from, to: [$to], subject: $subject, html: $html}')

            echo "Sending notification to: $TO_EMAIL"
            curl -s -X POST https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD"
            echo ""
          done
