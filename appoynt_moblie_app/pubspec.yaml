name: appoynt_mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Value equality comparison helper package
  equatable: ^2.0.8
  # Functional error handling type representation
  dartz: ^0.10.1

  # State Management
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.2.0

  # Networking
  dio: ^5.5.0

  # Local Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Maps and Geolocation
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Video Consultations
  agora_rtc_engine: ^6.3.2

  # Push Notifications
  firebase_messaging: ^15.0.3

  # Dependency Injection
  get_it: ^7.7.0

  # Connectivity Status
  connectivity_plus: ^6.0.3

  # QR Code Scanning
  mobile_scanner: ^5.1.1

  # Analytics Charts
  fl_chart: ^0.68.0

  # Custom Typography
  google_fonts: ^8.1.0

  # JSON Serialization
  json_annotation: ^4.9.0
  lucide_icons: ^0.257.0
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.11
  hive_generator: ^2.0.1
  json_serializable: ^6.8.0
  # Launcher icons generator package
  flutter_launcher_icons: ^0.13.1

flutter:
  # Enable material design styles
  uses-material-design: true
  # Define static asset paths for images
  assets:
    # Add path to the local assets/images directory
    - assets/images/
    # Add path to the local assets/icons directory
    - assets/icons/

# Configuration for generating app launcher icons
flutter_launcher_icons:
  # Enable and generate launcher icons for Android platform
  android: true
  # Enable and generate launcher icons for iOS platform
  ios: true
  # Path to the source image logo asset
  image_path: "assets/images/appoynt_icon_cropped.png"

