# Configuring JVM arguments and heap memory allocations
org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
# Enforcing usage of AndroidX support libraries
android.useAndroidX=true
# Enabling Jetifier support to migrate legacy libraries to AndroidX
android.enableJetifier=true
# Disabling Kotlin incremental compilation to prevent cross-drive relative path failures
kotlin.incremental=false
